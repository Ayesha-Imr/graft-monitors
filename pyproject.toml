[project]
name = "graft-monitors"
version = "0.1.0"
description = "GRAFT with decision-model monitors: pilot code (monitors, labeler, eval, analysis)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["monitors*", "labeling*", "analysis*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU",
    "pod: runs model-written code or GRAFT internals; Pod only, never on the laptop",
]
